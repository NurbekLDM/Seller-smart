<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Smart Retail ERP — xavfsiz kirish</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e8eef9;background:radial-gradient(800px 480px at 80% 5%,rgba(104,92,246,.3),transparent 62%),radial-gradient(600px 420px at 12% 98%,rgba(4,177,192,.16),transparent 60%),#091120}.card{width:min(455px,100%);padding:33px;border:1px solid rgba(255,255,255,.1);border-radius:24px;background:rgba(13,22,40,.86);box-shadow:0 28px 90px rgba(0,0,0,.42)}.mark{display:grid;place-items:center;width:54px;height:54px;margin-bottom:18px;border-radius:17px;background:linear-gradient(135deg,#655df5,#1593de);font-size:18px;font-weight:850}h1{margin:0;font-size:25px;letter-spacing:-.045em}p{color:#96a6bf;line-height:1.55}.field{margin-top:18px}label{display:block;margin-bottom:7px;font-size:12px;font-weight:700;color:#c3cfe0}input{width:100%;height:47px;padding:0 13px;border:1px solid rgba(255,255,255,.14);border-radius:11px;background:#101b30;color:#fff;font-size:14px;outline:none}input:focus{border-color:#786eff;box-shadow:0 0 0 3px rgba(110,100,245,.17)}button{width:100%;height:47px;margin-top:20px;border:0;border-radius:11px;background:linear-gradient(105deg,#6961fa,#3686ef);color:#fff;font-size:14px;font-weight:750;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.error{min-height:20px;margin-top:13px;color:#ff788c;font-size:12px}.footer{margin-top:17px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08);color:#8494ac;font-size:11px;line-height:1.6}.status{display:inline-block;margin-top:5px;color:#55d38c}
  </style>
  <script src="assets/app-config.js"></script>
  <script src="assets/vendor/supabase.js"></script>
  <script src="assets/auth-guard.js"></script>
</head>
<body>
  <main class="card">
    <div class="mark">SR</div>
    <h1>Smart Retail ERP</h1>
    <p>Mijozlar bazasi, qarzdorlik va savdo tizimiga xavfsiz kirish. Barcha qurilmalar bitta bazada ishlaydi.</p>
    <form id="loginForm">
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required autofocus maxlength="120"></div>
      <div class="field"><label for="password">Parol</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button id="submitButton" type="submit">Tizimga kirish</button>
      <div id="error" class="error" role="alert"></div>
    </form>
    <div class="footer">Himoyalangan Supabase sessiyasi · rollarga asoslangan ruxsatlar · versiyalangan sinxronizatsiya.<br><span class="status">Ma’lumotlar bulutdagi bazada saqlanadi.</span></div>
  </main>
  <script>
    (function () {
      'use strict';
      var client = window.smartRetailSupabase;
      var errorBox = document.getElementById('error');
      if (!client) {
        errorBox.textContent = 'Tizim hali sozlanmagan: assets/app-config.js ichida Supabase ma’lumotlarini kiriting.';
        document.getElementById('submitButton').disabled = true;
        return;
      }

      // Already signed in? Go straight to the app.
      if (window.smartRetailAuthReady) {
        window.smartRetailAuthReady.then(function (session) {
          if (session) window.location.replace('/');
        });
      }

      function seedInternalSession(profile) {
        // The ERP has its own legacy in-app login; a server-authenticated
        // ADMIN bypasses it, matching the previous server build's behaviour.
        if (profile.role === 'ADMIN') {
          localStorage.setItem('uzum-analytics-merged-session-v3', JSON.stringify({
            role: 'admin',
            username: profile.username || 'Admin',
            at: new Date().toISOString(),
            serverAuthenticated: true
          }));
          sessionStorage.setItem('srerp_auth_session_v6', 'AUTH-ROOT-ADMIN');
        }
      }

      document.getElementById('loginForm').addEventListener('submit', function (event) {
        event.preventDefault();
        var button = document.getElementById('submitButton');
        button.disabled = true;
        errorBox.textContent = '';
        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;

        client.auth.signInWithPassword({ email: email, password: password }).then(function (result) {
          if (result.error) throw new Error('Login yoki parol noto‘g‘ri.');
          var session = result.data.session;
          return client.from('profiles').select('role, active, username').eq('id', session.user.id).single()
            .then(function (profileResult) {
              var profile = profileResult.data;
              if (!profile || !profile.active) {
                return client.auth.signOut().then(function () {
                  throw new Error('Hisobingiz faol emas. Administratorga murojaat qiling.');
                });
              }
              seedInternalSession(profile);
              if (window.smartRetailSetAuthCookie) {
                window.smartRetailSetAuthCookie(session.access_token, 7 * 24 * 3600);
              }
              window.location.replace('/');
            });
        }).catch(function (problem) {
          errorBox.textContent = problem.message || 'Tizimga kirib bo‘lmadi.';
          document.getElementById('password').focus();
          button.disabled = false;
        });
      });
    })();
  </script>
</body>
</html>
