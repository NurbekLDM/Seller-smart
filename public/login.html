<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Smart Retail ERP — xavfsiz kirish</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e8eef9;background:radial-gradient(800px 480px at 80% 5%,rgba(104,92,246,.3),transparent 62%),radial-gradient(600px 420px at 12% 98%,rgba(4,177,192,.16),transparent 60%),#091120}.card{width:min(455px,100%);padding:33px;border:1px solid rgba(255,255,255,.1);border-radius:24px;background:rgba(13,22,40,.86);box-shadow:0 28px 90px rgba(0,0,0,.42);text-align:center}.mark{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 18px;border-radius:17px;background:linear-gradient(135deg,#655df5,#1593de);font-size:18px;font-weight:850}h1{margin:0;font-size:25px;letter-spacing:-.045em}p{color:#96a6bf;line-height:1.55}.field{margin-top:18px}label{display:block;margin-bottom:7px;font-size:12px;font-weight:700;color:#c3cfe0;text-align:left}input{width:100%;height:47px;padding:0 13px;border:1px solid rgba(255,255,255,.14);border-radius:11px;background:#101b30;color:#fff;font-size:14px;outline:none;text-align:left}input:focus{border-color:#786eff;box-shadow:0 0 0 3px rgba(110,100,245,.17)}button{width:100%;height:47px;margin-top:20px;border:0;border-radius:11px;background:linear-gradient(105deg,#6961fa,#3686ef);color:#fff;font-size:14px;font-weight:750;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.error{min-height:20px;margin-top:13px;color:#ff788c;font-size:12px}.notice{margin-top:16px;padding:11px 13px;border:1px solid rgba(255,176,32,.35);border-radius:11px;background:rgba(255,176,32,.09);color:#f3c778;font-size:12px;line-height:1.5;text-align:left}
  </style>
  <script src="assets/app-config.js"></script>
  <script src="assets/vendor/supabase.js"></script>
  <script src="assets/auth-guard.js"></script>
</head>
<body>
  <main class="card">
    <div class="mark">SR</div>
    <h1>Smart Retail ERP</h1>
    <p>Mijozlar bazasi, qarzdorlik va savdo tizimiga xavfsiz kirish. Barcha qurilmalar bitta bazada ishlaydi.</p>
    <form id="loginForm">
      <div class="field"><label for="email">Email yoki xodim logini</label><input id="email" name="email" type="text" autocomplete="username" required autofocus maxlength="120"></div>
      <div class="field"><label for="password">Parol</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button id="submitButton" type="submit">Tizimga kirish</button>
      <div id="error" class="error" role="alert"></div>
    </form>
    <div id="unsavedNotice" class="notice" hidden>Oxirgi o‘zgarishlar bazaga yuborilmadi — ular shu qurilmada saqlanib qoldi. Xuddi shu hisob bilan qayta kirsangiz, avtomatik yuboriladi.</div>
  </main>
  <script>
    (function () {
      'use strict';
      // Logout kept work that never reached the database: say so, so the
      // user knows it is not lost and how to get it synced.
      try {
        if (/[?&]unsaved=1(&|$)/.test(window.location.search)) {
          var notice = document.getElementById('unsavedNotice');
          if (notice) notice.hidden = false;
        }
      } catch (_) { /* ignore */ }
      var client = window.smartRetailSupabase;
      var errorBox = document.getElementById('error');
      if (!client) {
        errorBox.textContent = 'Tizim hali sozlanmagan: assets/app-config.js ichida Supabase ma’lumotlarini kiriting.';
        document.getElementById('submitButton').disabled = true;
        return;
      }

      /* The middleware refused the cookie our own session produced. Bouncing
         back to "/" would just be refused again — an unescapable redirect
         loop, since both hops use location.replace and write no history.
         Drop the local session instead and show the form with an error. */
      var refused = /[?&]session=rejected(&|$)/.test(window.location.search);
      if (refused) {
        try {
          var doomed = [];
          for (var index = 0; index < localStorage.length; index += 1) {
            var key = localStorage.key(index);
            if (key && key.indexOf('sb-') === 0) doomed.push(key);
          }
          doomed.forEach(function (key) { localStorage.removeItem(key); });
        } catch (_) { /* unreadable storage */ }
        try { client.auth.signOut(); } catch (_) { /* best effort */ }
        errorBox.textContent = 'Sessiya server tomonidan qabul qilinmadi. Qaytadan kiring — muammo takrorlansa, administratorga xabar bering.';
      } else if (/[?&]session=noproduct(&|$)/.test(window.location.search)) {
        // Signed out by the app: the account has neither product enabled.
        errorBox.textContent = 'Bu hisobga hech qanday mahsulot (Analitika yoki ERP) ulanmagan. Administratorga murojaat qiling.';
      } else if (window.smartRetailAuthReady) {
        // Already signed in? Go straight to the right app for the role.
        window.smartRetailAuthReady.then(function (session) {
          if (!session) return;
          var target = '/';
          try {
            var cached = JSON.parse(localStorage.getItem('sr-erp-profile') || 'null');
            if (cached && cached.id === session.user.id) {
              if (cached.role === 'STAFF') target = '/erp.html';
              // An owner who bought only the ERP lives on the ERP page.
              else if (Array.isArray(cached.products) && cached.products.indexOf('analytics') === -1) target = '/erp.html';
            }
          } catch (_) { /* ignore */ }
          window.location.replace(target);
        });
      }

      document.getElementById('loginForm').addEventListener('submit', function (event) {
        event.preventDefault();
        var button = document.getElementById('submitButton');
        button.disabled = true;
        button.textContent = 'Kirilmoqda...';
        errorBox.textContent = '';
        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;
        // ERP staff type a plain username; map it to the staff email domain.
        if (email && email.indexOf('@') === -1) {
          var staffDomain = (window.SMART_RETAIL_CONFIG && window.SMART_RETAIL_CONFIG.staffEmailDomain) || 'staff.sellersmart.uz';
          email = email.toLowerCase() + '@' + staffDomain;
        }

        client.auth.signInWithPassword({ email: email, password: password }).then(function (result) {
          if (result.error) throw new Error('Login yoki parol noto‘g‘ri.');
          var session = result.data.session;
          // Every column: a not-yet-migrated database must not fail the login.
          return client.from('profiles').select('*').eq('id', session.user.id).single()
            .then(function (profileResult) {
              var profile = profileResult.data;
              if (!profile && profileResult.error) {
                // A failed lookup is not the same as a blocked account —
                // do not sign the user out or claim their account is inactive.
                throw new Error('Ma’lumotlar bazasiga ulanib bo‘lmadi. Birozdan so‘ng qayta urinib ko‘ring.');
              }
              if (!profile || !profile.active) {
                return client.auth.signOut().then(function () {
                  throw new Error('Hisobingiz faol emas. Administratorga murojaat qiling.');
                });
              }
              if (profile.expires_at && new Date(profile.expires_at).getTime() <= Date.now()) {
                return client.auth.signOut().then(function () {
                  throw new Error('Hisobingiz muddati tugagan. Administratorga murojaat qiling.');
                });
              }
              var isStaff = Boolean(profile.workspace_owner) || profile.erp_role === 'STAFF';
              /* Products (supabase/2026-09-03-products.sql): 'analytics',
                 'erp' or both. Owners land on the product they bought;
                 staff always work in the ERP. A database without the
                 column yet grants both. */
              var products = Array.isArray(profile.products) ? profile.products : ['analytics', 'erp'];
              if (!isStaff && !products.length) {
                return client.auth.signOut().then(function () {
                  throw new Error('Bu hisobga hech qanday mahsulot (Analitika yoki ERP) ulanmagan. Administratorga murojaat qiling.');
                });
              }
              var target = isStaff ? '/erp.html' : (products.indexOf('analytics') !== -1 ? '/' : '/erp.html');
              // Cache identity so the next page can seed synchronously.
              try {
                localStorage.setItem('sr-username', profile.username || session.user.email || '');
                localStorage.setItem('sr-erp-profile', JSON.stringify({
                  id: session.user.id,
                  role: isStaff ? 'STAFF' : 'OWNER',
                  name: profile.username || session.user.email || '',
                  modules: Array.isArray(profile.erp_modules) ? profile.erp_modules : [],
                  workspace: profile.workspace_owner || session.user.id,
                  products: products
                }));
              } catch (_) {}
              if (window.smartRetailSetAuthCookie) {
                window.smartRetailSetAuthCookie(session.access_token, 7 * 24 * 3600);
              }
              window.location.replace(target);
            });
        }).catch(function (problem) {
          errorBox.textContent = problem.message || 'Tizimga kirib bo‘lmadi.';
          document.getElementById('password').focus();
          button.disabled = false;
          button.textContent = 'Tizimga kirish';
        });
      });
    })();
  </script>
</body>
</html>
