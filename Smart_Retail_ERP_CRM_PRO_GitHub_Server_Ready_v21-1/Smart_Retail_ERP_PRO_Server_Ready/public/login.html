<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Smart Retail ERP — xavfsiz kirish</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e8eef9;background:radial-gradient(800px 480px at 80% 5%,rgba(104,92,246,.3),transparent 62%),radial-gradient(600px 420px at 12% 98%,rgba(4,177,192,.16),transparent 60%),#091120}.card{width:min(455px,100%);padding:33px;border:1px solid rgba(255,255,255,.1);border-radius:24px;background:rgba(13,22,40,.86);box-shadow:0 28px 90px rgba(0,0,0,.42)}.mark{display:grid;place-items:center;width:54px;height:54px;margin-bottom:18px;border-radius:17px;background:linear-gradient(135deg,#655df5,#1593de);font-size:18px;font-weight:850}h1{margin:0;font-size:25px;letter-spacing:-.045em}p{color:#96a6bf;line-height:1.55}.field{margin-top:18px}label{display:block;margin-bottom:7px;font-size:12px;font-weight:700;color:#c3cfe0}input{width:100%;height:47px;padding:0 13px;border:1px solid rgba(255,255,255,.14);border-radius:11px;background:#101b30;color:#fff;font-size:14px;outline:none}input:focus{border-color:#786eff;box-shadow:0 0 0 3px rgba(110,100,245,.17)}button{width:100%;height:47px;margin-top:20px;border:0;border-radius:11px;background:linear-gradient(105deg,#6961fa,#3686ef);color:#fff;font-size:14px;font-weight:750;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.error{min-height:20px;margin-top:13px;color:#ff788c;font-size:12px}.footer{margin-top:17px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08);color:#8494ac;font-size:11px;line-height:1.6}.status{display:inline-block;margin-top:5px;color:#55d38c}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">SR</div>
    <h1>Smart Retail ERP</h1>
    <p>Serverdagi mijozlar bazasi, qarzdorlik va savdo tizimiga xavfsiz kirish.</p>
    <form id="loginForm">
      <div class="field"><label for="username">Login</label><input id="username" name="username" autocomplete="username" required autofocus maxlength="80"></div>
      <div class="field"><label for="password">Parol</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button id="submitButton" type="submit">Tizimga kirish</button>
      <div id="error" class="error" role="alert"></div>
    </form>
    <div class="footer">Himoyalangan server sessiyasi · SQLite zaxira bazasi · CSRF va login urinishlari nazorati.<br><span class="status">Ma’lumotlar serverda saqlanadi.</span></div>
  </main>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async event => {
      event.preventDefault();
      const button = document.getElementById('submitButton');
      const error = document.getElementById('error');
      button.disabled = true;
      error.textContent = '';
      try {
        const response = await fetch('/api/v1/auth/login', {
          method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: document.getElementById('username').value.trim(), password: document.getElementById('password').value })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Tizimga kirib bo‘lmadi.');
        if (result.user.role === 'ADMIN') {
          localStorage.setItem('uzum-analytics-merged-session-v3', JSON.stringify({ role: 'admin', username: result.user.username, at: new Date().toISOString(), serverAuthenticated: true }));
          sessionStorage.setItem('srerp_auth_session_v6', 'AUTH-ROOT-ADMIN');
        }
        window.location.replace('/');
      } catch (problem) {
        error.textContent = problem.message;
        document.getElementById('password').focus();
      } finally { button.disabled = false; }
    });
  </script>
</body>
</html>
