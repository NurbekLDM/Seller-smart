openapi: 3.1.0
info:
  title: Smart Retail ERP API
  version: 21.0.0
  description: Authenticated customer, receivables, payment and state synchronization API.
servers:
  - url: https://erp.example.uz
  - url: http://127.0.0.1:8080
security:
  - SessionCookie: []
paths:
  /api/health:
    get:
      summary: Public service health
      security: []
      responses:
        '200':
          description: Service is healthy.
  /api/v1/auth/login:
    post:
      summary: Create secure session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200': { description: Session cookie and CSRF token issued. }
        '401': { description: Invalid credentials. }
        '429': { description: Too many login attempts. }
  /api/v1/auth/me:
    get:
      summary: Current session and CSRF token
      responses:
        '200': { description: Current user. }
        '401': { description: Session required. }
  /api/v1/auth/logout:
    post:
      summary: Revoke current session
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '200': { description: Session revoked. }
  /api/v1/state:
    get:
      summary: Read complete tenant snapshot
      responses:
        '200': { description: Snapshot and optimistic version. }
    put:
      summary: Replace tenant snapshot with optimistic concurrency
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, snapshot]
              properties:
                expectedVersion: { type: integer, minimum: 0 }
                snapshot:
                  type: object
                  additionalProperties: { type: string }
      responses:
        '200': { description: Updated version. }
        '409': { description: Another client updated the snapshot. }
        '422': { description: Invalid or sensitive snapshot contents. }
  /api/v1/customers:
    get:
      summary: Search and paginate customers
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: active, in: query, schema: { type: boolean } }
        - { name: segment, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200': { description: Customer list with outstanding balances. }
    post:
      summary: Create customer
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerInput' }
      responses:
        '201': { description: Customer created. }
        '409': { description: Duplicate phone number. }
  /api/v1/customers/{id}:
    parameters: [{ $ref: '#/components/parameters/EntityId' }]
    get:
      summary: Read a customer profile
      responses:
        '200': { description: Customer and current debt. }
        '404': { description: Customer not found. }
    patch:
      summary: Update a customer profile
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerInput' }
      responses:
        '200': { description: Updated customer. }
    delete:
      summary: Delete customer without financial history
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '200': { description: Customer deleted. }
        '403': { description: Administrator role required. }
        '409': { description: Customer has financial history. }
  /api/v1/debts:
    get:
      summary: Search customer receivables
      parameters:
        - { name: customerId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [open, paid, overdue] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Receivables ordered by due date. }
    post:
      summary: Create receivable and optional initial payment
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DebtInput' }
      responses:
        '201': { description: Debt created. }
        '409': { description: Customer inactive or credit limit exceeded. }
  /api/v1/debts/{id}:
    parameters: [{ $ref: '#/components/parameters/EntityId' }]
    patch:
      summary: Update due date, invoice number or note
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '200': { description: Debt updated. }
  /api/v1/debts/{id}/payments:
    parameters: [{ $ref: '#/components/parameters/EntityId' }]
    post:
      summary: Record a partial or final payment
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentInput' }
      responses:
        '201': { description: Payment recorded and debt recalculated. }
        '422': { description: Payment exceeds outstanding balance. }
  /api/v1/payments:
    get:
      summary: Search payment history
      responses:
        '200': { description: Payment ledger. }
  /api/v1/dashboard:
    get:
      summary: Customer, collections and debt indicators
      responses:
        '200': { description: Aggregated KPI values. }
  /api/v1/audit:
    get:
      summary: Administrator-only audit history
      responses:
        '200': { description: Audit events. }
        '403': { description: Administrator role required. }
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: srerp_sid
  parameters:
    EntityId:
      name: id
      in: path
      required: true
      schema: { type: string }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
  schemas:
    CustomerInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 180 }
        phone: { type: string, maxLength: 40 }
        limit: { type: number, minimum: 0 }
        creditDays: { type: integer, minimum: 1, maximum: 365 }
        segment: { type: string }
        telegram: { type: string }
        email: { type: string, format: email }
        address: { type: string }
        active: { type: boolean }
    DebtInput:
      type: object
      required: [customerId, total, dueDate]
      properties:
        customerId: { type: string }
        total: { type: number, exclusiveMinimum: 0 }
        paid: { type: number, minimum: 0 }
        dueDate: { type: string, format: date }
        invoiceNo: { type: string }
        note: { type: string }
        overrideLimit: { type: boolean }
    PaymentInput:
      type: object
      required: [amount]
      properties:
        amount: { type: number, exclusiveMinimum: 0 }
        date: { type: string, format: date }
        method: { type: string }
        reference: { type: string }
        note: { type: string }
