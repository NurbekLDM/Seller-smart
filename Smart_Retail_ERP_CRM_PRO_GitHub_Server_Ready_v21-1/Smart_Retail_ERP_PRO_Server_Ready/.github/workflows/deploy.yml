name: Deploy Smart Retail ERP

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-retail-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          set -eu
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          case "$DEPLOY_HOST" in *[!a-zA-Z0-9.-]*) echo 'Invalid DEPLOY_HOST'; exit 1;; esac
          case "$DEPLOY_USER" in *[!a-zA-Z0-9_-]*) echo 'Invalid DEPLOY_USER'; exit 1;; esac
          case "$DEPLOY_PATH" in /*) ;; *) echo 'DEPLOY_PATH must be absolute'; exit 1;; esac
          case "$DEPLOY_PATH" in *[!a-zA-Z0-9._/-]*) echo 'Invalid DEPLOY_PATH'; exit 1;; esac

      - name: Configure SSH with verified host key
        run: |
          set -eu
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload application without secrets or databases
        run: |
          set -eu
          ssh -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          rsync -az --delete \
            --exclude='.git' --exclude='.env' --exclude='data/' --exclude='node_modules/' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Rebuild and verify production services
        run: |
          set -eu
          ssh -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && test -f .env && docker compose --profile public up -d --build && docker compose ps && curl --fail --silent http://127.0.0.1:8080/api/health"
