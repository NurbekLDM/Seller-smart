name: smart-retail-erp

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-retail-erp:21.0.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/smart-retail.sqlite
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    volumes:
      - retail_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 12s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles:
      - public
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  retail_data:
  caddy_data:
  caddy_config:
